name: Actualizar catálogo (agente)

# Agente que añade novedades de ggjersey.x.yupoo.com al catálogo.
# Se ejecuta los días 1 y 15 de cada mes (≈ cada 2 semanas; cron no admite "cada 14 días").
# Requiere los secretos R2_ACCESS_KEY_ID y R2_SECRET_ACCESS_KEY (Settings → Secrets → Actions).
on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular: clasifica y cuenta, no descarga ni escribe nada'
        type: boolean
        default: true
      max_new:
        description: 'Máximo de productos nuevos por ejecución (freno de seguridad)'
        default: '800'

concurrency:
  group: catalog-agent
  cancel-in-progress: false

permissions:
  contents: write    # commit de products.json
  actions: write     # lanzar el despliegue tras el commit

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # En ejecuciones programadas no hay "inputs": ahí NO es simulación.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      MAX_NEW: ${{ github.event_name == 'workflow_dispatch' && inputs.max_new || '800' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Autotest del clasificador (si falla, no se toca el catálogo)
        run: node agent/selftest.js --show 0

      - name: Ejecutar agente
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node agent/update-catalog.js --dry-run --max-new "$MAX_NEW" --report "$RUNNER_TEMP/dryrun.json"
          else
            node agent/update-catalog.js --max-new "$MAX_NEW"
          fi

      - name: Resumen
        if: always()
        run: |
          f=data/catalog-agent-report.json
          [ "$DRY_RUN" = "true" ] && f="$RUNNER_TEMP/dryrun.json"
          [ -f "$f" ] && node -e "
            const r=require(require('path').resolve(process.argv[1]));
            const L=['## Agente de catálogo'+(r.dryRun?' (simulación)':''),
              '- Añadidos: **'+r.added+'** · fallos de imagen: '+r.failed.length+' · reintentos pendientes: '+r.retryPending,
              '- Álbumes evaluados: '+r.candidates+' · duplicados: '+r.tally.duplicate+' · fuera de alcance: '+r.tally.skip+' · a revisar: '+r.tally.review,
              '', '### Equipos desconocidos (añadir a agent/teams.js si procede)',
              ...r.unknownTeams.slice(0,25).map(u=>'- '+u.team+' ('+u.count+')'),
              '', '### Dudosos (no se añadieron)',
              ...r.review.slice(0,25).map(x=>'- '+x.title+' — '+x.reason)];
            console.log(L.join('\n'));" "$f" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit y despliegue
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/catalog-agent-report.json ] || { echo "El agente no generó informe."; exit 1; }
          # El agente tarda ~40 min y main puede avanzar mientras tanto: un rebase de products.json
          # choca. Se guarda su resultado y se reaplican sus altas sobre el main más reciente.
          A="$RUNNER_TEMP/agent-out"
          mkdir -p "$A"
          cp data/products.json data/catalog-agent-state.json data/catalog-agent-report.json "$A/"
          N=$(node -p "require('./data/catalog-agent-report.json').added")
          git config user.name  "catalog-agent[bot]"
          git config user.email "catalog-agent[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$A/catalog-agent-state.json" "$A/catalog-agent-report.json" data/
            node agent/merge-products.js "$A/products.json" "$A/catalog-agent-report.json"
            git add data/products.json data/catalog-agent-state.json data/catalog-agent-report.json
            if git diff --cached --quiet; then
              echo "Sin cambios en el catálogo."
              exit 0
            fi
            git commit -m "chore(catálogo): agente añade $N productos [$(date -u '+%Y-%m-%d')]"
            if git push origin HEAD:main; then
              # Los push hechos con GITHUB_TOKEN no disparan otros workflows: se lanza el despliegue a mano.
              gh workflow run deploy.yml --ref main
              exit 0
            fi
            echo "Push rechazado (main cambió); reintento $i/3…"
            sleep 15
          done
          exit 1
